[project]
name = "frg-agents"
version = "0.1.0"
description = "LLM-powered agent swarm for FRG devnet testing"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.0",
    "docker>=7.0.0",
    "pynacl>=1.5.0",
    "structlog>=24.0.0",
]

[project.scripts]
frg-swarm = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
