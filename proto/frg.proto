syntax = "proto3";

package frg;

option go_package = "github.com/imattau/frg/proto";

service FRG {
  rpc SubmitTx(RawBytes) returns (SubmitResponse);
  rpc SubmitBatch(RawBytesArray) returns (SubmitResponse);
  rpc SubscribeBlocks(Empty) returns (stream RawBytes);
  rpc GetStatus(Empty) returns (StatusResponse);
}

message RawBytes {
  bytes data = 1;
}

message RawBytesArray {
  repeated bytes data = 1;
}

message SubmitResponse {
  bool ok = 1;
  string error = 2;
}

message Empty {}

message StatusResponse {
  uint64 height = 1;
  bytes state_root = 2;
  uint64 peer_count = 3;
  uint64 mempool_len = 4;
  uint64 validator_count = 5;
  uint32 consensus_round = 6;
  string consensus_phase = 7;
  bool grpc_only = 8;
}
