syntax = "proto3";

package frg;

option go_package = "github.com/imattau/frg/proto";

service FRG {
  rpc SubmitTx(RawBytes) returns (SubmitResponse);
  rpc SubmitBatch(RawBytesArray) returns (SubmitResponse);
  rpc SubscribeBlocks(Empty) returns (stream RawBytes);
  rpc GetStatus(Empty) returns (StatusResponse);
  rpc GetAccount(AccountRequest) returns (AccountResponse);
  rpc GetContractState(ContractStateRequest) returns (ContractStateResponse);
  rpc ListValidators(Empty) returns (ValidatorList);
  rpc ListMempool(Empty) returns (MempoolList);
}

message RawBytes {
  bytes data = 1;
}

message RawBytesArray {
  repeated bytes data = 1;
}

message SubmitResponse {
  bool ok = 1;
  string error = 2;
}

message Empty {}

message StatusResponse {
  uint64 height = 1;
  bytes state_root = 2;
  uint64 peer_count = 3;
  uint64 mempool_len = 4;
  uint64 validator_count = 5;
  uint32 consensus_round = 6;
  string consensus_phase = 7;
  bool grpc_only = 8;
}

message AccountRequest {
  bytes pubkey = 1;
}

message AccountResponse {
  bytes pubkey = 1;
  string balance = 2;
  uint64 nonce = 3;
}

message ContractStateRequest {
  bytes contract_address = 1;
  bytes key = 2;
}

message ContractStateResponse {
  bytes contract_address = 1;
  bool exists = 2;
  bytes state_root = 3;
  bytes key = 4;
  bool found = 5;
  bytes value = 6;
}

message ValidatorEntry {
  bytes pubkey = 1;
  string bond = 2;
}

message ValidatorList {
  repeated ValidatorEntry validators = 1;
}

message MempoolEntry {
  bytes txid = 1;
  string sender = 2;
  uint64 nonce = 3;
}

message MempoolList {
  repeated MempoolEntry entries = 1;
}
